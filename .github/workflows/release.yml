name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and publish MSI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag and source branch
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N]: $tag"
          }

          $isPrerelease = $tag.Contains('-')
          $expectedBranch = if ($isPrerelease) { 'dev' } else { 'master' }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $branchCommit = (git rev-parse "origin/$expectedBranch").Trim()
          if ($tagCommit -ne $branchCommit) {
              throw "Release tag $tag must point to the current origin/$expectedBranch commit."
          }

          $candidateTags = @(git tag --merged "$tag^" --list 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$' -and $_ -ne $tag } |
              ForEach-Object {
                  if ($_ -notmatch '^v(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$') { return }
                  if (-not $isPrerelease -and $Matches[4]) { return }
                  [pscustomobject]@{
                      Tag = $_
                      Major = [int]$Matches[1]
                      Minor = [int]$Matches[2]
                      Patch = [int]$Matches[3]
                      Pre = if ($Matches[4]) { @{ alpha = 0; beta = 1; rc = 2 }[$Matches[4]] } else { 3 }
                      Number = if ($Matches[5]) { [int]$Matches[5] } else { 0 }
                  }
              } |
              Sort-Object Major, Minor, Patch, Pre, Number)
          $previousTag = if ($candidateTags.Count -gt 0) { $candidateTags[-1].Tag } else { '' }

          if ($previousTag) {
              .\scripts\release-metadata.ps1 -Mode ValidateVersion -Tag $tag -PreviousTag $previousTag
          } else {
              .\scripts\release-metadata.ps1 -Mode ValidateVersion -Tag $tag
          }

          $publishedTagJson = gh release list --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Failed to query published releases.' }
          $previousReleaseTag = @($publishedTagJson | ConvertFrom-Json |
              ForEach-Object { [string]$_.tagName } |
              Where-Object { $_ -ne $tag -and $_ -match '^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$' } |
              Select-Object -First 1)
          $previousNotesTag = if ($previousReleaseTag.Count -gt 0) { $previousReleaseTag[0] } else { '' }

          $version = $tag.Substring(1)
          "value=$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousNotesTag" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Collect merged feature PRs
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          $allPath = Join-Path $env:RUNNER_TEMP 'all-pull-requests.json'
          $selectedPath = Join-Path $env:RUNNER_TEMP 'release-pull-requests.json'
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          gh pr list --state merged --base dev --limit 1000 --json number,title,body,author,labels,mergedAt,mergeCommit > $allPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to query merged feature pull requests.' }

          $head = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $previous = if ($env:PREVIOUS_TAG) { (git rev-list -n 1 $env:PREVIOUS_TAG).Trim() } else { $null }
          $all = @(Get-Content -LiteralPath $allPath -Raw | ConvertFrom-Json)
          $selected = @($all | Where-Object {
              $oid = $_.mergeCommit.oid
              if ([string]::IsNullOrWhiteSpace($oid)) { return $false }
              git merge-base --is-ancestor $oid $head 2>$null
              if ($LASTEXITCODE -ne 0) { return $false }
              if ($previous) {
                  git merge-base --is-ancestor $oid $previous 2>$null
                  if ($LASTEXITCODE -eq 0) { return $false }
              }
              return $true
          })
          ConvertTo-Json -InputObject $selected -Depth 10 | Set-Content -LiteralPath $selectedPath -Encoding utf8

          .\scripts\release-metadata.ps1 `
              -Mode ComposePullRequests `
              -PullRequestsPath $selectedPath `
              -OutputPath $releaseNotesPath `
              -Tag $env:RELEASE_TAG `
              -PreviousTag $env:PREVIOUS_TAG `
              -RepositoryUrl "https://github.com/$env:GITHUB_REPOSITORY"
          "path=$releaseNotesPath" >> $env:GITHUB_OUTPUT

      - name: Build release package
        shell: pwsh
        run: .\build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GhostSlacking-${{ steps.version.outputs.value }}-build
          path: artifacts/releases/${{ steps.version.outputs.value }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseJson = & gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Failed to query existing GitHub Releases.' }
          $existingTags = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($existingTags -contains $env:RELEASE_TAG) {
              throw "GitHub Release $env:RELEASE_TAG already exists; published assets will not be overwritten."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.path }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $releaseDirectory = "artifacts\releases\$env:RELEASE_VERSION"
          $installer = "$releaseDirectory\GhostSlacking-$env:RELEASE_VERSION-win-x64.msi"
          $checksum = "$installer.sha256"
          $manifest = "$releaseDirectory\release.json"
          $args = @(
              'release', 'create', $env:RELEASE_TAG, $installer, $checksum, $manifest,
              '--verify-tag', '--notes-file', $env:RELEASE_NOTES_FILE,
              '--title', "GhostSlacking $env:RELEASE_VERSION"
          )
          if ($env:IS_PRERELEASE -eq 'true') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release $env:RELEASE_TAG." }
