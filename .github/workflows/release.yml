name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and publish MSI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tag must use the vMAJOR.MINOR.PATCH format: $tag"
          }

          $version = [version]$Matches[1]
          $previousTag = @(git tag --merged "$tag^" --list 'v*.*.*' --sort=-version:refname |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Select-Object -First 1)
          if ($previousTag.Count -gt 0) {
              .\scripts\release-metadata.ps1 -Mode ValidateVersion -Tag $tag -PreviousTag $previousTag[0]
          } else {
              .\scripts\release-metadata.ps1 -Mode ValidateVersion -Tag $tag
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$($previousTag | Select-Object -First 1)" >> $env:GITHUB_OUTPUT

      - name: Build release notes from merged PR
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          $pullRequestsPath = Join-Path $env:RUNNER_TEMP 'release-pull-requests.json'
          $prBodyPath = Join-Path $env:RUNNER_TEMP 'release-pr-body.md'
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          gh api `
              -H 'Accept: application/vnd.github+json' `
              -H 'X-GitHub-Api-Version: 2022-11-28' `
              "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" > $pullRequestsPath
          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to query pull requests associated with the release commit.'
          }

          .\scripts\release-metadata.ps1 `
              -Mode SelectReleasePr `
              -PullRequestsPath $pullRequestsPath `
              -CommitSha $env:GITHUB_SHA `
              -OutputPath $prBodyPath
          .\scripts\release-metadata.ps1 `
              -Mode Compose `
              -BodyPath $prBodyPath `
              -OutputPath $releaseNotesPath `
              -Tag $env:RELEASE_TAG `
              -PreviousTag $env:PREVIOUS_TAG `
              -RepositoryUrl "https://github.com/$env:GITHUB_REPOSITORY"
          "path=$releaseNotesPath" >> $env:GITHUB_OUTPUT

      - name: Build release package
        shell: pwsh
        run: .\build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GhostSlacking-${{ steps.version.outputs.value }}-build
          path: artifacts/releases/${{ steps.version.outputs.value }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseJson = & gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to query existing GitHub Releases."
          }

          $existingTags = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($existingTags -contains $env:RELEASE_TAG) {
              throw "GitHub Release $env:RELEASE_TAG already exists; published assets will not be overwritten."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          $releaseDirectory = "artifacts\releases\$env:RELEASE_VERSION"
          $installer = "$releaseDirectory\GhostSlacking-$env:RELEASE_VERSION-win-x64.msi"
          $checksum = "$installer.sha256"
          $manifest = "$releaseDirectory\release.json"

          gh release create $env:RELEASE_TAG `
              $installer `
              $checksum `
              $manifest `
              --verify-tag `
              --notes-file $env:RELEASE_NOTES_FILE `
              --title "GhostSlacking $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish GitHub Release $env:RELEASE_TAG."
          }
