# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "GhostSlacking"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = 'Stop'

Write-Host ("Initializing GhostSlacking with PowerShell {0}." -f $PSVersionTable.PSVersion)

foreach ($tool in @('git', 'dotnet', 'pwsh')) {
    if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
        throw "Required development tool not found: $tool"
    }
}

if (-not (Test-Path -LiteralPath './GhostSlacking.sln')) {
    throw 'Run setup from the GhostSlacking repository root.'
}

dotnet restore GhostSlacking.sln
if ($LASTEXITCODE -ne 0) {
    throw 'Dependency restore failed.'
}'''

[[actions]]
name = "构建"
icon = "test"
command = "dotnet build GhostSlacking.sln --configuration Debug"
platform = "win32"

[[actions]]
name = "Release 测试"
icon = "debug"
command = "dotnet test GhostSlacking.sln --configuration Release"
platform = "win32"

[[actions]]
name = "运行"
icon = "run"
command = "dotnet run --project src/GhostSlacking.App --configuration Debug"
platform = "win32"

[[actions]]
name = "还原依赖"
icon = "tool"
command = "dotnet restore GhostSlacking.sln"
